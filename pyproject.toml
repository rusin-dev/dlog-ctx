[project]
name = "decisions-ctx"
version = "0.1.0"
description = "项目上下文索引器：API 文档 + 决策日志，在 SQLite 中建立关联"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Third-party extractor plugins can be declared here; the core stays dependency-free.
api = []

[project.scripts]
decisions = "decisions.cli:main"
decisions-api = "decisions.api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decisions"]

[tool.hatch.build.targets.sdist]
include = ["src/decisions", "tests", "README.md", "DESIGN.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pylint.main]
# Lint against the floor of `requires-python`.
py-version = "3.11"

[tool.pylint."messages control"]
# Single-method containers (`Backend`, `ExtractCallable`) are intentional.
min-public-methods = 1

[tool.pylint.design]
# The pipeline is deliberately explicit: SQL/query builders take their filters
# as keyword arguments and the dataclasses mirror database rows one-to-one, so
# the stock advisory thresholds are too tight for this code base.
max-args = 10
max-positional-arguments = 10
max-attributes = 16
max-locals = 30
max-branches = 20
max-statements = 60
max-returns = 8
